<!doctype html>
<html lang="pt-BR" data-theme="light" data-msa-functional="true">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="theme-color" content="#232b2b" />
    <title>MSA | Produção e engenharia</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;650;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./styles.css" />
    <script>
      try {
        const p = JSON.parse(localStorage.getItem("msa.ui.preferences.v1"));
        document.documentElement.dataset.theme =
          p?.theme === "dark" ||
          (p?.theme === "system" &&
            matchMedia("(prefers-color-scheme: dark)").matches)
            ? "dark"
            : "light";
      } catch {}
    </script>
    <script defer src="./vendor/papaparse.min.js"></script>
    <script defer src="./vendor/chart.umd.min.js"></script>
    <script defer src="./vendor/lucide.min.js"></script>
    <script type="module" src="./src/ui/main.js"></script>
  </head>
  <body>
    <a class="skip-link" href="#content">Ir para o conteúdo</a>
    <div id="app">
      <div class="boot">
        <span class="brand-mark">MSA</span>
        <p>Carregando…</p>
      </div>
    </div>
    <div id="toast" role="status" aria-live="polite"></div>
    <dialog id="modal" aria-labelledby="modal-title"></dialog>
    <noscript>Ative o JavaScript para acessar o sistema.</noscript>
  </body>
</html>
